name: 시세 자동 갱신

on:
  schedule:
    # 평일 21:30 UTC = 한국 시간 다음 날 아침 06:30 (미국 장 마감 뒤)
    # GitHub 사정으로 몇십 분 늦게 돌 때도 있음
    - cron: "30 21 * * 1-5"
  workflow_dispatch:   # Actions 탭의 'Run workflow' 버튼으로 바로 돌릴 수 있게

permissions:
  contents: write      # prices.json을 커밋하려면 필요

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: 가격과 환율 받기
        run: node scripts/update-prices.mjs

      - name: prices.json 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
            exit 0
          fi
          git commit -m "시세 갱신 $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
